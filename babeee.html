<!DOCTYPE html>
<html>

<body style="margin:0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
        camera.position.z = 12;

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x8C1800, 1.2));

        function makePetal(base = [0.78, 0.12, 0.34], tip = [1.0, 0.72, 0.82]) {
            const g = new THREE.PlaneGeometry(1, 1, 10, 12);
            const p = g.attributes.position;
            const colors = [];

            for (let i = 0; i < p.count; i++) {
                const u = p.getY(i) + 0.5;
                const v = p.getX(i) * 2;
                const width = 0.6 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.6);
                p.setXYZ(i, v * width, u * 1.5, 0.5 * u * u * u);

                const m = Math.min(1, u * 1.1 + Math.abs(v) * 0.12);
                colors.push(
                    base[0] + (tip[0] - base[0]) * m,
                    base[1] + (tip[1] - base[1]) * m,
                    base[2] + (tip[2] - base[2]) * m
                );
            }
            g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            g.computeVertexNormals();
            return g;
        }

        const flower = new THREE.Group();
        flower.rotation.x = 0.8; // เอียงดอกไม้เข้าหากล้อง
        const geo = makePetal();
        const COUNT = 40;
        const petals = [];

        for (let i = 0; i < COUNT; i++) {
            const n = i / (COUNT - 1);

            const pivot = new THREE.Object3D();
            pivot.rotation.y = i * 2.39996;

            const mesh = new THREE.Mesh(
                geo,
                new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    side: THREE.DoubleSide
                })
            );
            mesh.position.z = 0.05 + 0.3 * n; // กลีบนอกตั้งอยู่ห่างศูนย์กลางมากกว่า
            pivot.add(mesh);
            flower.add(pivot);
            petals.push({
                mesh,
                n,
                size: 0.35 + 0.85 * n
            });
        }

        // กลุ่มใหญ่: หมุนทั้งต้นรอบแกนตั้ง
        const root = new THREE.Group();
        root.position.y = 1;
        root.add(flower);
        scene.add(root);

        // เกสรสีเหลืองตรงกลางดอก
        const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.16, 16, 12),
            new THREE.MeshStandardMaterial({
                color: 0xffd166
            })
        );
        core.position.y = 0.05;
        flower.add(core);

        // ก้าน
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0.12, -1.5, 0.1),
            new THREE.Vector3(-0.15, -3.0, 0),
            new THREE.Vector3(0.05, -4.5, 0),
        ]);
        const stem = new THREE.Mesh(
            new THREE.TubeGeometry(curve, 30, 0.07, 8),
            new THREE.MeshStandardMaterial({
                color: 0x2f7d4a
            })
        );
        root.add(stem);

        // ใบ 2 ใบ
        const leafGeo = makePetal([0.1, 0.38, 0.2], [0.45, 0.78, 0.4]);
        [1, -1].forEach((side, k) => {
            const leaf = new THREE.Mesh(
                leafGeo,
                new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    side: THREE.DoubleSide
                })
            );
            leaf.position.set(0, -2.2 - k * 0.8, 0);
            leaf.rotation.set(-0.35, 0, side * 1.05);
            leaf.scale.set(1.2, 1.4, 1.2);
            root.add(leaf);
        });

        //ขั้นที่ 6: ทำให้ดอกบาน 
        let bloomStart = performance.now() + 500;

        function animate(now) {
            const b = Math.max(0, Math.min(1, (now - bloomStart) / 12000));

            for (const p of petals) {
                const l = Math.max(0, Math.min(1, b * 1.6 - (1 - p.n) * 0));
                const e = l * l * (3 - 2 * l);
                const closed = -(0.12 + 0.12 * p.n);
                const open = 0.25 + 1.3 * Math.pow(p.n, 0.8);
                p.mesh.rotation.x = closed + (open - closed) * e;
                p.mesh.scale.setScalar(p.size * (0.85 + 0.15 * e));
            }

            root.rotation.y += 0.005 + 0.02 * (1 - b);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ปุ่มให้บานซ้ำ
        const btn = document.createElement('button');
        btn.textContent = 'Love me more and more';
        btn.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border:0;border-radius:999px;background:#f08fa6;font-size:16px;cursor:pointer';
        btn.onclick = () => {
            bloomStart = performance.now() + 200;
        };
        document.body.appendChild(btn);
    </script>
</body>

</html>
